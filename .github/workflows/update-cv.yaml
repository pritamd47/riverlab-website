name: update-cv
run-name: typeset cv

on:
  # run when called from another workflow
  workflow_call:
    outputs:
      changed:
        value: ${{ jobs.update-cv.outputs.changed }}

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Debug dump
        if: runner.debug == '1'
        uses: crazy-max/ghaction-dump-context@v2

      - name: Checkout branch contents
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Typeset CV
        working-directory: cv
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=. main.tex

      - name: Check if CV changed
        id: changed
        uses: tj-actions/verify-changed-files@v18
        with:
          files: |
            cv/main.pdf

      - name: Commit typeset CV
        if: steps.changed.outputs.files_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "cv/main.pdf"
          commit_message: "Typeset CV"

    outputs:
      changed: ${{ steps.changed.outputs.files_changed || false }}
