# site properties and page defaults
title: RIVER Lab
subtitle: Remote Sensing, Informatics & Visualization for Earth Resources · IIT Bombay
description: Research lab at CSRE, IIT Bombay working on satellite remote sensing, hydrological modelling, and water-resource management for regulated rivers and reservoirs.
url: https://riverlab.in
