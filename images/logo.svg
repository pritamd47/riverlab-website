<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
  <defs>
    <!-- Combined left + right face region for continuous waves -->
    <clipPath id="clip-sides">
      <polygon points="-19.5,-11.25 19.5,-11.25 19.5,11.25 0,22.5 -19.5,11.25"/>
    </clipPath>
  </defs>

  <style>
    .wave {
      stroke-dasharray: 14 7;
      animation: flow 2.4s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -21; }
    }
  </style>

  <!-- Left face – in shadow -->
  <polygon fill="#075985" opacity="0.85"
    points="-19.5,-11.25 0,0 0,22.5 -19.5,11.25"/>

  <!-- Right face – partially lit -->
  <polygon fill="#38bdf8"
    points="19.5,-11.25 19.5,11.25 0,22.5 0,0"/>

  <!-- Top face – directly lit from top-right -->
  <polygon fill="#b0def7"
    points="0,-22.5 19.5,-11.25 0,0 -19.5,-11.25"/>

  <!-- Continuous river waves across both side faces -->
  <g clip-path="url(#clip-sides)">
    <path class="wave" fill="none" stroke="white" stroke-width="2.5" opacity="0.55"
      d="M-38 6 Q-19 -4 0 6 Q19 16 38 6"/>
    <path class="wave" fill="none" stroke="white" stroke-width="1.8" opacity="0.35"
      d="M-38 14 Q-19 4 0 14 Q19 24 38 14"
      style="animation-delay: -1.2s"/>
  </g>

  <!-- Outer hex border only -->
  <polygon fill="none" stroke="#64748b" stroke-width="2.3" stroke-linejoin="round"
    points="0,-22.5 19.5,-11.25 19.5,11.25 0,22.5 -19.5,11.25 -19.5,-11.25"/>

  <!-- Orbiting satellite dot -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    <circle cx="0" cy="-33" r="3.5" fill="#64748b" opacity="0.85"/>
  </g>
</svg>
